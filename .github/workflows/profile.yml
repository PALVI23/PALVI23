name: Update profile panels

on:
  schedule:
    - cron: "17 2 * * *"   # daily
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/profile.yml"

permissions:
  contents: write

concurrency:
  group: profile-panels
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render panels with live stats
        env:
          # Optional: add a PROFILE_TOKEN secret (classic PAT, read:user) to include private contributions.
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        run: python3 scripts/build_profile.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/panels
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update profile stats panels"
          git push
