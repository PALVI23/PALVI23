<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="145" height="78" viewBox="0 0 145 78" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#0a1f55"/><stop offset="1" stop-color="#0a1f55"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e2b6b"/><stop offset="1" stop-color="#0b2257"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5cc2ff"/><stop offset="0.5" stop-color="#2f7bff"/><stop offset="1" stop-color="#5cc2ff"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f7bff" stop-opacity="0.9"/><stop offset="1" stop-color="#2f7bff" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="sparkle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9fe0ff"/><stop offset="1" stop-color="#2f8bff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
<rect width="145" height="78" fill="#0a1f55"/><rect width="145" height="78" fill="url(#bg)" opacity="0"/>

<rect x="12" y="14" width="129" height="46" rx="10" fill="url(#card)"/><rect x="12" y="14" width="129" height="46" rx="10" fill="none" stroke="#2f7bff" stroke-width="6" opacity=".18" filter="url(#softglow)"/><rect x="12.75" y="14.75" width="127.5" height="44.5" rx="10" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
<text x="32" y="47" font-size="27" font-weight="800" fill="#20beff" filter="url(#glow)">k</text>
<text x="64" y="44" font-size="18" font-weight="600" fill="#eaf2ff">Kaggle</text>
</svg>
