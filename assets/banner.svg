<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050b1f"/>
      <stop offset="0.55" stop-color="#0a1a44"/>
      <stop offset="1" stop-color="#06143a"/>
    </linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d2a6e"/>
      <stop offset="1" stop-color="#123b8f"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#16306b"/>
      <stop offset="0.8" stop-color="#10255a"/>
      <stop offset="1" stop-color="#10255a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b4fb8"/>
      <stop offset="1" stop-color="#0a1f55"/>
    </linearGradient>
    <linearGradient id="mesh" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fa9ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#1a5cff" stop-opacity="0.15"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6fc3ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#6fc3ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cfe2ff"/>
    </linearGradient>
    <g id="leaf"><path d="M0 0 C 8 -6 18 -4 22 4 C 14 10 4 8 0 0 Z" fill="#1f6b4a"/><path d="M0 0 L 20 3" stroke="#0f3d2a" stroke-width="0.8"/></g>
    <g id="leaf2"><path d="M0 0 C 8 -6 18 -4 22 4 C 14 10 4 8 0 0 Z" fill="#2a8a5c"/><path d="M0 0 L 20 3" stroke="#14563a" stroke-width="0.8"/></g>
    <clipPath id="card"><rect width="1200" height="340" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="340" fill="url(#bg)"/>

    <!-- stars -->
    <g fill="#cfe2ff">
      <circle cx="420" cy="40" r="1.2" opacity=".7"/><circle cx="520" cy="300" r="1" opacity=".5"/>
      <circle cx="880" cy="40" r="1.3" opacity=".7"/><circle cx="960" cy="90" r="1" opacity=".6"/>
      <circle cx="350" cy="120" r="1" opacity=".5"/><circle cx="1150" cy="40" r="1.2" opacity=".6"/>
      <circle cx="610" cy="30" r="1" opacity=".6"/><circle cx="770" cy="300" r="1" opacity=".4"/>
    </g>

    <!-- window -->
    <g>
      <rect x="40" y="0" width="250" height="250" fill="url(#win)"/>
      <g fill="#071537" opacity=".95">
        <rect x="150" y="150" width="22" height="100"/><rect x="175" y="120" width="18" height="130"/>
        <rect x="196" y="165" width="26" height="85"/><rect x="225" y="135" width="16" height="115"/>
        <rect x="244" y="175" width="30" height="75"/><rect x="60" y="190" width="30" height="60"/>
        <rect x="95" y="170" width="20" height="80"/><rect x="118" y="200" width="28" height="50"/>
        <path d="M181 120 L184 98 L187 120 Z"/>
      </g>
      <g fill="#5fa8ff" opacity=".7">
        <rect x="179" y="135" width="3" height="3"/><rect x="186" y="150" width="3" height="3"/>
        <rect x="201" y="180" width="3" height="3"/><rect x="230" y="150" width="3" height="3"/>
        <rect x="250" y="190" width="3" height="3"/><rect x="100" y="185" width="3" height="3"/>
      </g>
      <circle cx="115" cy="60" r="22" fill="url(#glow)"/>
      <path d="M118 46 A14 14 0 1 0 128 70 A11 11 0 1 1 118 46 Z" fill="#eaf3ff"/>
      <g stroke="#0a1838" stroke-width="7" fill="none">
        <rect x="40" y="0" width="250" height="250"/>
        <line x1="165" y1="0" x2="165" y2="250"/><line x1="40" y1="120" x2="290" y2="120"/>
      </g>
      <path d="M240 26 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 Z" fill="#ffffff" opacity=".9"/>
    </g>

    <!-- desk -->
    <rect x="0" y="262" width="430" height="80" fill="url(#desk)"/>
    <rect x="0" y="258" width="400" height="6" fill="#2a4f9c" opacity=".5"/>

    <!-- laptop -->
    <g transform="translate(90 170)">
      <path d="M8 0 L130 -6 L140 82 L18 88 Z" fill="#0b1a40" stroke="#3d6fd1" stroke-width="2"/>
      <path d="M16 6 L126 1 L134 76 L24 80 Z" fill="url(#screen)"/>
      <path d="M30 20 L120 16" stroke="#7fbfff" stroke-width="2" opacity=".35"/>
      <path d="M30 32 L100 29" stroke="#7fbfff" stroke-width="2" opacity=".25"/>
      <path d="M0 88 L150 82 L176 92 L18 100 Z" fill="#1a3474" stroke="#3d6fd1" stroke-width="1.5"/>
    </g>

    <!-- mug + steam -->
    <g transform="translate(275 205)">
      <path d="M0 0 H34 V44 Q34 54 24 54 H10 Q0 54 0 44 Z" fill="#e8f0ff"/>
      <path d="M34 10 Q48 12 46 26 Q44 36 34 34" fill="none" stroke="#e8f0ff" stroke-width="5"/>
      <ellipse cx="17" cy="2" rx="17" ry="4" fill="#5a3a2a"/>
      <g fill="none" stroke="#bcd6ff" stroke-width="2.5" stroke-linecap="round" opacity=".7">
        <path d="M10 -6 q-6 -10 0 -18 q6 -8 0 -18"><animate attributeName="opacity" values=".2;.8;.2" dur="3s" repeatCount="indefinite"/></path>
        <path d="M22 -6 q-6 -10 0 -18 q6 -8 0 -18"><animate attributeName="opacity" values=".8;.2;.8" dur="3s" repeatCount="indefinite"/></path>
      </g>
    </g>

    <!-- books -->
    <g>
      <rect x="20" y="245" width="70" height="12" rx="2" fill="#2457b8"/>
      <rect x="26" y="233" width="62" height="12" rx="2" fill="#163f8f"/>
      <rect x="320" y="248" width="56" height="10" rx="2" fill="#2457b8"/>
    </g>

    <!-- vines -->
    <g>
      <path d="M50 0 C 60 40 40 80 55 130 C 62 160 48 190 60 220" stroke="#174d34" stroke-width="2.5" fill="none"/>
      <use href="#leaf" transform="translate(54 20) rotate(20)"/><use href="#leaf2" transform="translate(50 45) rotate(160)"/>
      <use href="#leaf" transform="translate(46 70) rotate(30)"/><use href="#leaf2" transform="translate(50 95) rotate(150)"/>
      <use href="#leaf" transform="translate(55 125) rotate(15)"/><use href="#leaf2" transform="translate(56 150) rotate(170)"/>
      <use href="#leaf" transform="translate(53 180) rotate(25)"/><use href="#leaf2" transform="translate(58 205) rotate(150)"/>
      <path d="M290 0 C 300 30 285 55 300 90 C 306 110 296 130 302 150" stroke="#174d34" stroke-width="2.5" fill="none"/>
      <use href="#leaf2" transform="translate(294 15) rotate(10)"/><use href="#leaf" transform="translate(292 38) rotate(170)"/>
      <use href="#leaf2" transform="translate(290 62) rotate(30)"/><use href="#leaf" transform="translate(298 88) rotate(160)"/>
      <use href="#leaf2" transform="translate(300 115) rotate(20)"/><use href="#leaf" transform="translate(302 140) rotate(150)"/>
      <path d="M330 0 C 345 20 335 40 350 60" stroke="#174d34" stroke-width="2" fill="none"/>
      <use href="#leaf" transform="translate(336 15) rotate(30)"/><use href="#leaf2" transform="translate(342 40) rotate(170)"/>
      <path d="M0 10 C 15 30 10 60 20 80" stroke="#174d34" stroke-width="2" fill="none"/>
      <use href="#leaf2" transform="translate(8 28) rotate(20)"/><use href="#leaf" transform="translate(14 55) rotate(160)"/>
    </g>

    <!-- right: wireframe terrain + network -->
    <g opacity=".95">
      <path d="M880 340 L960 270 L1010 250 L1060 200 L1110 190 L1160 140 L1200 130 L1200 340 Z" fill="url(#mesh)" opacity=".35"/>
      <g stroke="#3fa9ff" stroke-width="0.8" fill="none" opacity=".55">
        <path d="M880 340 L960 270 L1010 250 L1060 200 L1110 190 L1160 140 L1200 130"/>
        <path d="M900 340 L975 285 L1025 268 L1075 222 L1125 212 L1170 170 L1200 162"/>
        <path d="M930 340 L990 300 L1040 286 L1090 246 L1140 236 L1180 200 L1200 195"/>
        <path d="M960 340 L1010 315 L1060 305 L1105 272 L1155 262 L1200 232"/>
        <path d="M990 340 L1035 330 L1080 322 L1125 298 L1170 290 L1200 270"/>
        <path d="M960 270 L960 340 M1010 250 L1010 340 M1060 200 L1060 340 M1110 190 L1110 340 M1160 140 L1160 340"/>
        <path d="M960 270 L1010 315 M1010 250 L1060 305 M1060 200 L1105 272 M1110 190 L1155 262 M1160 140 L1200 232"/>
      </g>
      <g stroke="#6fc3ff" stroke-width="1.5" fill="none" opacity=".8">
        <polyline points="960,235 995,205 1030,215 1065,165 1095,175 1125,120 1150,128 1175,55"/>
      </g>
      <g fill="#bfe4ff">
        <circle cx="960" cy="235" r="3"/><circle cx="995" cy="205" r="3.5"/><circle cx="1030" cy="215" r="3"/>
        <circle cx="1065" cy="165" r="4"/><circle cx="1095" cy="175" r="3"/><circle cx="1125" cy="120" r="4"/>
        <circle cx="1150" cy="128" r="3"/><circle cx="1175" cy="55" r="4.5"/>
      </g>
      <circle cx="1175" cy="55" r="14" fill="url(#glow)" opacity=".7">
        <animate attributeName="r" values="10;18;10" dur="3s" repeatCount="indefinite"/>
      </circle>
      <g fill="#3fa9ff" opacity=".6">
        <circle cx="1040" cy="240" r="2"/><circle cx="1130" cy="210" r="2"/><circle cx="1180" cy="170" r="2"/>
        <circle cx="990" cy="285" r="2"/><circle cx="1090" cy="250" r="2"/>
      </g>
    </g>

    <!-- title block -->
    <path d="M760 30 l4 12 12 4 -12 4 -4 12 -4 -12 -12 -4 12 -4 Z" fill="#ffffff">
      <animate attributeName="opacity" values="1;.4;1" dur="2.5s" repeatCount="indefinite"/>
    </path>
    <path d="M600 62 Q 790 25 930 75" stroke="#4aa3ff" stroke-width="1.2" fill="none" opacity=".5"/>
    <text x="760" y="125" text-anchor="middle" font-family="Cinzel, 'Trajan Pro', Georgia, 'Times New Roman', serif" font-size="46" letter-spacing="5" fill="url(#title)">PALVISHA</text>
    <text x="760" y="180" text-anchor="middle" font-family="Cinzel, 'Trajan Pro', Georgia, 'Times New Roman', serif" font-size="46" letter-spacing="5" fill="url(#title)">CHANGKAKATI</text>
    <line x1="630" y1="218" x2="675" y2="218" stroke="#6fb5ff" stroke-width="1.5"/>
    <line x1="845" y1="218" x2="890" y2="218" stroke="#6fb5ff" stroke-width="1.5"/>
    <text x="760" y="226" text-anchor="middle" font-family="'Segoe Script', 'Brush Script MT', 'Lucida Handwriting', cursive" font-style="italic" font-size="28" letter-spacing="2" fill="#7cc4ff">AI Engineer</text>
    <text x="760" y="275" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" letter-spacing="2.5" fill="#dbe8ff">MACHINE LEARNING   |   GENERATIVE AI   |   DATA SCIENCE</text>
  </g>
  <rect x="1" y="1" width="1198" height="338" rx="18" fill="none" stroke="#2a4f9c" stroke-opacity=".6" stroke-width="2"/>
</svg>
